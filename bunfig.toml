[install]
# Only install package versions published at least 24 hours ago (86400 seconds)
# This protects against supply chain attacks from freshly published malicious packages
minimumReleaseAge = 86400

# Exclude wormhole packages from the minimum release age requirement
# These are trusted internal packages that we want to consume immediately
# Note: Bun doesn't support wildcards yet, so we must list each package explicitly
# This list is generated from `bun pm ls --all | grep @wormhole-`
minimumReleaseAgeExcludes = [
  # @wormhole-foundation SDK packages
  "@xertraplatform/wormhole-sdk",
  "@xertraplatform/wormhole-sdk-algorand",
  "@xertraplatform/wormhole-sdk-algorand-core",
  "@xertraplatform/wormhole-sdk-algorand-tokenbridge",
  "@xertraplatform/wormhole-sdk-aptos",
  "@xertraplatform/wormhole-sdk-aptos-cctp",
  "@xertraplatform/wormhole-sdk-aptos-core",
  "@xertraplatform/wormhole-sdk-aptos-tokenbridge",
  "@xertraplatform/wormhole-sdk-base",
  "@xertraplatform/wormhole-sdk-connect",
  "@xertraplatform/wormhole-sdk-cosmwasm",
  "@xertraplatform/wormhole-sdk-cosmwasm-core",
  "@xertraplatform/wormhole-sdk-cosmwasm-ibc",
  "@xertraplatform/wormhole-sdk-cosmwasm-tokenbridge",
  "@xertraplatform/wormhole-sdk-definitions",
  "@xertraplatform/wormhole-sdk-definitions-ntt",
  "@xertraplatform/wormhole-sdk-evm",
  "@xertraplatform/wormhole-sdk-evm-cctp",
  "@xertraplatform/wormhole-sdk-evm-core",
  "@xertraplatform/wormhole-sdk-evm-ntt",
  "@xertraplatform/wormhole-sdk-evm-portico",
  "@xertraplatform/wormhole-sdk-evm-tbtc",
  "@xertraplatform/wormhole-sdk-evm-tokenbridge",
  "@xertraplatform/wormhole-sdk-icons",
  "@xertraplatform/wormhole-sdk-route-ntt",
  "@xertraplatform/wormhole-sdk-solana",
  "@xertraplatform/wormhole-sdk-solana-cctp",
  "@xertraplatform/wormhole-sdk-solana-core",
  "@xertraplatform/wormhole-sdk-solana-ntt",
  "@xertraplatform/wormhole-sdk-solana-tbtc",
  "@xertraplatform/wormhole-sdk-solana-tokenbridge",
  "@xertraplatform/wormhole-sdk-stacks",
  "@xertraplatform/wormhole-sdk-stacks-core",
  "@xertraplatform/wormhole-sdk-sui",
  "@xertraplatform/wormhole-sdk-sui-cctp",
  "@xertraplatform/wormhole-sdk-sui-core",
  "@xertraplatform/wormhole-sdk-sui-ntt",
  "@xertraplatform/wormhole-sdk-sui-tokenbridge",
  "@xertraplatform/wormhole-connect",
  "@xertraplatform/cctp-executor-route",
  # @wormhole-labs packages
  "@wormhole-labs/wallet-aggregator-aptos",
  "@wormhole-labs/wallet-aggregator-core",
  "@wormhole-labs/wallet-aggregator-evm",
  "@wormhole-labs/wallet-aggregator-solana",
  "@wormhole-labs/wallet-aggregator-sui",
  # Mayan packages
  "@mayanfinance/swap-sdk",
  "@testnet-mayan/swap-sdk"
]
